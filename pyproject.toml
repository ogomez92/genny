[project]
name = "genny"
version = "0.1.0"
description = "Procedural sound generator CLI for games: synths, drums, sfx, car engines, formant speech, filters and effects. Designed to be driven by AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.scripts]
genny = "genny.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genny"]
